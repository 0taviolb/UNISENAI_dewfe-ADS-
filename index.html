<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formulário Completo</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Cadastro</h1>
        <h3>Formulário de Cadastro</h3>
    </header>

    <main>

        <!-- Formulário de Cadastro -->
        <section>

            <form id="formCadastro">

                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <p>Este é um formulário de fieldset.</p>

                    <label for="nome">Nome completo:</label><br>
                    <input type="text" id="nome" name="nome" required minlength="3"
                        placeholder="Seu nome">
                    <br><br>

                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email"
                        placeholder="exemplo@email.com" required>
                    <br><br>

                    <label for="dataNascimento">Data de nascimento:</label><br>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                    <br><br>

                    <label for="informacoes">Informações:</label><br>
                    <textarea id="informacoes" name="informacoes" rows="4" cols="30"></textarea>
                    <br><br>

                    <label>Gênero:</label><br>
                    <input type="radio" id="masculino" name="genero" value="Masculino">
                    <label for="masculino">Masculino</label>

                    <input type="radio" id="feminino" name="genero" value="Feminino">
                    <label for="feminino">Feminino</label>

                    <input type="radio" id="outro" name="genero" value="Outro">
                    <label for="outro">Outro</label>

                    <br><br>

                    <label>Interesses:</label><br>

                    <!-- Obrigatório: name="interesses" -->
                    <input type="checkbox" id="tecnologia" name="interesses" value="Tecnologia">
                    <label for="tecnologia">Tecnologia</label>

                    <input type="checkbox" id="esportes" name="interesses" value="Esportes">
                    <label for="esportes">Esportes</label>

                    <input type="checkbox" id="musica" name="interesses" value="Música">
                    <label for="musica">Música</label>

                    <input type="checkbox" id="jogos" name="interesses" value="Jogos">
                    <label for="jogos">Jogos</label>

                    <br><br>

                    <label for="estado">Estado:</label><br>
                    <select id="estado" name="estado">
                        <option value="">Selecione</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>

                    <br><br>

                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>

                    <br><br>

                    <label for="arquivo">Upload de imagem:</label><br>

                    <!-- Obrigatório: name="arquivo" -->
                    <input type="file" id="arquivo" name="arquivo" accept="image/*">

                    <br><br>

                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>

                </fieldset>

            </form>

        </section>

        <!-- Resultado será exibido aqui, não é necessário editar -->
        <section>
            <h2 id="sec-resultado">Resultado</h2>
            <div id="resultado"></div>
        </section>

    </main>

    <footer>

        <p>&copy; 2026 - Formulário Turma 01 ADS</p>

        <nav aria-label="Documentações">
            <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
                    alt="Documentação HTML" width="40">
            </a>

            <a href="https://developer.mozilla.org/pt-BR/docs/Web/CSS" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
                    alt="Documentação CSS" width="40">
            </a>

            <a href="https://developer.mozilla.org/pt-BR/docs/Web/JavaScript" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                    alt="Documentação JavaScript" width="40">
            </a>
        </nav>

    </footer>

</body>

</html>
